    Projects:
      - name: "Master's Capstone (In Progress): Evaluating World Model Latent States"
        start_date: 2026-09
        summary: Currently working on a systematic way to evaluate the latent states that world models learn, rather than judging them only by downstream task performance. Advised by Professor Chris Amato, working with PhD student Ahmed Agha.
        highlights:
          - Focused on robotics settings, where information like contact and force is only partly visible to the robot

      - name: Language-Conditioned Diffusion Policy
        url: /projects/imitation-learning-diffusion/
        date: 2026-04 # 2026-03 to 2026-04
        highlights:
          - Reimplemented a diffusion policy (PyTorch) with FiLM language conditioning to drive a 7-DoF Franka robotic arm on the 10 long-horizon tasks of LIBERO-10 (robosuite/MuJoCo), generating target poses and gripper states from vision and language
          - Built a modular pipeline for swappable vision encoders; ResNet-18 from scratch reached 32.5% task success vs 0% for frozen SigLIP2
          - Generated ~40 LLM paraphrases per task for a 4x gain in task success (32.5% vs 7.5%) over task-ID memorization

      - name: Diffusion-Based Image Geolocalization (PLONK)
        url: /projects/geo-localization_diffusion/
        date: 2026
        highlights:
          - Reproduced PLONK's Riemannian flow-matching geolocalization on OSV-5M (1,076 km mean error vs 1,069 km reported)
          - Benchmarked StreetCLIP, DINOv2, and MobileCLIP2-S4 encoders; MobileCLIP2-S4 stayed within a few percent of DINOv2 at a fraction of the size
          - Built a KD-tree proximity pipeline to fuse embeddings from nearby images via averaging and attention

      - name: Estimating Trajectory From IMU
        url: /projects/imu/
        date: 2025-12 # 2025-09 to 2025-12
        highlights:
          - Estimated vehicle trajectory from IMU data using a weighted-average complementary filter (α=0.98) to fuse magnetometer and gyroscope headings, achieving position accuracy within 2 m of GPS for up to 6.8 seconds of dead reckoning
          - Calibrated the magnetometer via least-squares for hard/soft iron correction, validated on an 18-minute dataset with 10+ turns
          - Developed Python ROS2 Jazzy drivers for a VN-100 IMU/GPS, implementing custom messages, NMEA parsing, and UTM conversion

      - name: Bias Transfer in Model Distillation
        url: /projects/model_distillation/
        date: 2025-12 # 2025-11 to 2025-12
        highlights:
          - Built the teacher pipeline, generating soft sentiment labels on IMDB with few-shot prompted Llama 3.1 8B Instruct for BoW, CNN, and DistilBERT students
          - Measured bias on the Equity Evaluation Corpus, finding that bias transferred to every student, with the largest shifts in DistilBERT

      - name: Robotic Photographer for 3D Gaussian Splatting
        url: /projects/robot_photographer/
        date: 2025-04 # 2025-03 to 2025-04
        highlights:
          - Deployed ROS Noetic on a LoCoBot mobile robot (Create 3 base) to autonomously detect, approach, and circumnavigate objects via segmentation (no April tags), capturing RGBD imagery for 3D Gaussian Splatting reconstruction
          - Implemented ZeroMQ networking to stream RGBD data to a remote workstation for a sub-minute capture workflow (team of 4)

